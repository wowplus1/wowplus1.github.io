# 한 시간마다 최신 피드를 받아 사이트를 다시 만든다.
name: build
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['archive.json']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node update.js
      - run: node build.js _site
      - name: archive.json 저장
        run: |
          if ! git diff --quiet archive.json; then
            git config user.name "dealsite-bot"
            git config user.email "dealsite-bot@users.noreply.github.com"
            git add archive.json
            git commit -m "딜 기록 갱신"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
