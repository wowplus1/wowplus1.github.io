# 10분마다 최신 피드를 확인해서, 새 딜이 있을 때만 사이트를 다시 만든다.
# (깃허브 예약 실행은 늦거나 건너뛰는 일이 있다. 정각·*/10 은 몰려서 더 잘 밀린다고 해 4분 어긋나게 둔다)
name: build
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['archive.json']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: upd
        run: node update.js
      - if: steps.upd.outputs.changed == 'true' || github.event_name != 'schedule'
        run: node build.js _site
      - name: archive.json 저장
        if: steps.upd.outputs.changed == 'true'
        run: |
          if ! git diff --quiet archive.json; then
            git config user.name "dealsite-bot"
            git config user.email "dealsite-bot@users.noreply.github.com"
            git add archive.json
            git commit -m "딜 기록 갱신"
            git pull --rebase -q || true   # 그 사이 사람이 코드를 올렸으면 받아서 (10/23 push 거절로 한 번 실패)
            git push
          fi
      - name: IndexNow 목록 (바뀐 페이지)
        if: steps.upd.outputs.changed == 'true' || github.event_name != 'schedule'
        run: node indexnow.js prepare _site
      - if: steps.upd.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5
      - if: steps.upd.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        if: steps.upd.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
      - name: IndexNow 보내기
        if: steps.upd.outputs.changed == 'true' || github.event_name != 'schedule'
        run: node indexnow.js send
