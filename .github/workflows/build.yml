# 10분마다 최신 피드를 확인해서, 새 딜이 있을 때만 사이트를 다시 만든다.
# (깃허브 예약 실행은 몇 분씩 늦게 도는 일이 있다)
name: build
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['archive.json']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: upd
        run: node update.js
      - if: steps.upd.outputs.changed == 'true' || github.event_name != 'schedule'
        run: node build.js _site
      - name: archive.json 저장
        if: steps.upd.outputs.changed == 'true'
        run: |
          if ! git diff --quiet archive.json; then
            git config user.name "dealsite-bot"
            git config user.email "dealsite-bot@users.noreply.github.com"
            git add archive.json
            git commit -m "딜 기록 갱신"
            git push
          fi
      - if: steps.upd.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5
      - if: steps.upd.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        if: steps.upd.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
